# Configurazione del progetto. Le stagioni si indicano con l'anno di inizio (2025 = 2025-26).
seed: 20261123

seasons:
  dev: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]   # sviluppo e taratura
  test: [2025]                                                              # test, da non toccare fino alla fine
  live: [2026]

paths:
  raw: data/raw              # archivi scaricati (non nel repository: si riscaricano)
  processed: data/processed  # Parquet elaborati (nel repository)
  external: data/external    # dati raccolti da GitHub Actions (quote, BPM, injury report)
  reports: reports

sources:
  # Dataset play-by-play pubblico (licenza Apache 2.0): https://github.com/shufinskiy/nba_data
  nba_data_list: https://raw.githubusercontent.com/shufinskiy/nba_data/main/list_data.txt
  nba_data_raw: https://raw.githubusercontent.com/shufinskiy/nba_data/main/datasets/{name}.tar.xz
  kinds: [nbastatsv3, nbastats, cdnnba, pbpstats]

qc:
  min_total_points: 120      # sotto questa soglia un punteggio finale è considerato incompleto (esistono partite vere da 136 punti totali)
  minutes_tolerance: 0.5     # minuti di squadra ammessi di scarto rispetto a 240 (+25 per supplementare)

# Scelte di modello fissate sulle sole stagioni di sviluppo (fasi 3-5)
models:
  team_ratings: {lam_eff: 5.0, lam_pace: 5.0}           # fase 4: ritmo ed efficienza di squadra
  context_margin_groups: [base, riposo, fine_stagione]  # fase 4: contesto essenziale sullo scarto
  context_total_groups: [base]                          # fase 4: solo correzione di livello sul totale
  elo: {k: 20.0, hca: 70.0, carry: 0.75, per_point: 28.0}   # fase 5
  gbm: {n_estimators: 200, learning_rate: 0.03, num_leaves: 7}   # fase 5: correzione sui rating di squadra
  ensemble:
    margin_components: [m_players, m_team, m_base, m_elo, m_gbm]
    total_components: [t_players]          # sul totale l'ensemble peggiora: si usa il modello della fase 4
    hl_seasons: 2.0
    report_only: true
    first_season: 2018
  distribution: {kind: t, window: 4, hl_seasons: 2.0}
