[project]
name = "nba-model"
version = "0.1.0"
description = "Modello predittivo NBA 2026/27: ingestione, feature, modelli, valutazione contro il mercato"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "requests>=2.32",
    "lightgbm>=4.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
remote = ["lxml>=5", "pdfplumber>=0.11"]

[project.scripts]
nba = "nba.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
